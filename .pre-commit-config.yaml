---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: type-check
        name: type-check (vue-tsc)
        entry: pnpm run type-check
        language: system
        types: [ts, vue]
        pass_filenames: false

      - id: eslint
        name: eslint (boundaries & rules)
        entry: pnpm run lint
        language: system
        types: [javascript, ts, vue]
        pass_filenames: false
